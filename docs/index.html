<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f5f0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1b1b1a" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="영어 공부">
  <title>영어 공부</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <section id="view-cards" class="view active"><div id="cards-body"></div></section>
    <section id="view-quiz" class="view"><div id="quiz-body"></div></section>
    <section id="view-grammar" class="view"><div id="grammar-body"></div></section>
    <section id="view-stats" class="view"><div id="stats-body"></div></section>
    <section id="view-listen" class="view"><div id="listen-body"></div></section>
  </main>

  <nav class="tabs">
    <button data-tab="cards" class="active"><svg viewBox="0 0 24 24"><path d="M8 7.5h10.5a1.5 1.5 0 0 1 1.5 1.5v9a1.5 1.5 0 0 1-1.5 1.5H8A1.5 1.5 0 0 1 6.5 18V9A1.5 1.5 0 0 1 8 7.5zM4 15.5V6a1.5 1.5 0 0 1 1.5-1.5H16"/></svg>카드</button>
    <button data-tab="quiz"><svg viewBox="0 0 24 24"><path d="M5 19l1-4L16.5 4.5l3 3L9 18zM14.5 6.5l3 3M13 19.5h7"/></svg>시험</button>
    <button data-tab="grammar"><svg viewBox="0 0 24 24"><path d="M12 6.5C10 5 7 4.6 4 5v13.5c3-.4 6 0 8 1.5 2-1.5 5-1.9 8-1.5V5c-3-.4-6 0-8 1.5zM12 6.5V20"/></svg>문법</button>
  </nav>
  <div id="toast" class="toast" hidden></div>
  <script src="app.js"></script>
</body>
</html>
